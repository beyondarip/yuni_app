{% extends 'base.html' %}
{% block title %}Edit Post{% endblock %}

{% block content %}
<div class="form-container">
  <!-- Card -->
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Edit Your Post</h1>
      <p class="form-subtitle">Refine your message</p>
    </div>

    <div class="form-body">
      <!-- Form -->
      <form method="post" action="">
        <div class="form-group">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" name="title" value="{{ post.title }}" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="content" class="form-label">Content</label>
          <textarea id="content" name="content" class="form-textarea" required>{{ post.content }}</textarea>
        </div>

        <div class="form-footer">
          <a href="{{ url_for('index') }}" class="btn-secondary">Cancel</a>
          <button type="submit" class="btn-warning">
            <span>✏️</span>
            Update Post
          </button>
        </div>
      </form>
      <!-- End Form -->
    </div>
  </div>
  <!-- End Card -->
</div>
{% endblock %}
