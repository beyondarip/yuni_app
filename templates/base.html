<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Blog{% endblock %} - Yuni Blog</title>
  <!-- Local Preline UI Inspired Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/preline-style.css') }}">
</head>
<body>
  <!-- Navigation Header -->
  <header>
    <nav>
      <!-- Brand/Logo -->
      <a href="{{ url_for('index') }}" class="brand">
        Yuni Blog
      </a>
      
      <!-- Navigation Links -->
      <div class="nav-links">
        <a href="{{ url_for('index') }}" class="nav-link">Home</a>
        <a href="{{ url_for('create') }}" class="btn-primary">
          <span>+</span>
          New Post
        </a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer>
    <a href="{{ url_for('index') }}" class="footer-brand">Yuni Blog</a>
    <div>
      <p class="footer-text">© {{ now().year }} Yuni'sBlog. Dibuat dengan ❤️</p>
      <p class="footer-text">Dikelola oleh: nurwahyuni syamsul</p>
    </div>
  </footer>

</body>
</html>
