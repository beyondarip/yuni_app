{% extends 'base.html' %}
{% block title %}Create a New Post{% endblock %}

{% block content %}
<div class="form-container">
  <!-- Card -->
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Create a New Post</h1>
      <p class="form-subtitle">Share your thoughts with the world</p>
    </div>

    <div class="form-body">
      <!-- Form -->
      <form method="post" action="">
        <div class="form-group">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" name="title" class="form-input" placeholder="Your post title" required>
        </div>

        <div class="form-group">
          <label for="content" class="form-label">Content</label>
          <textarea id="content" name="content" class="form-textarea" placeholder="Write your amazing content here..." required></textarea>
        </div>

        <div class="form-footer">
          <a href="{{ url_for('index') }}" class="btn-secondary">Cancel</a>
          <button type="submit" class="btn-success">
            <span>💾</span>
            Save Post
          </button>
        </div>
      </form>
      <!-- End Form -->
    </div>
  </div>
  <!-- End Card -->
</div>
{% endblock %}
